[package]
name = "iced_fontello"
version = "0.15.0-dev"
edition = "2024"
description = "Generate type-safe icon fonts for `iced` at compile time"
repository = "https://github.com/hecrj/iced_fontello"
license = "MIT"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "interface", "widgets"]
rust-version = "1.92"

[dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "json", "multipart"] }
sha2 = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6+spec-1.1.0"
zip = "8.6.0"
base16ct = { version = "1.0.0", features = ["alloc"] }

[workspace]
members = ["example"]

[workspace.dependencies]
iced_fontello = { version = "0.15.0-dev", path = "." }
